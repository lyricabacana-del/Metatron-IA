name: Crear Bloq desde WhatsApp
on:
  issues:
    types: [opened]
jobs:
  crear:
    if: contains(github.event.issue.title, 'crear bloq')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear archivo bloq
        run: |
          NUM=$(echo "${{ github.event.issue.title }}" | grep -oE "[0-9]+" | head -1)
          NUM=$(printf "%03d" $NUM)
          mkdir -p bloqs
          cat > bloqs/bloq${NUM}.html <<EOF
          <!DOCTYPE html>
          <html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width">
          <title>BLOQ $NUM</title>
          <style>body{margin:0;background:#0a0a0f;color:#fff;font-family:system-ui;padding:20px}.card{background:#111119;border:1px solid #222;padding:20px;border-radius:16px;max-width:700px;margin:20px auto}h1{color:#60a5fa}</style>
          </head><body><div class="card"><h1>BLOQ $NUM</h1><p>Creado automático desde WhatsApp</p><p>Issue: ${{ github.event.issue.title }}</p><a href="/">Volver</a></div></body></html>
          EOF
          git config user.name "metatron-bot"
          git config user.email "bot@metatron.ia"
          git add bloqs/bloq${NUM}.html
          git commit -m "auto: crear bloq $NUM"
          git push
      - name: Cerrar Issue
        run: gh issue close ${{ github.event.issue.number }} --reason completed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
